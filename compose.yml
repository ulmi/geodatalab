# Base service definition — machine-independent, safe to commit.
#
# Per-machine / per-instance settings (workspace, data folders, limits, start
# folder, name) live in geodatalab.toml and are rendered by the manager into the
# generated, gitignored .gdl/<instance>/compose.data.yml, passed as a second -f.
# Manage them with:  pixi run gdl
services:
  gis:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROFILE: ${PROFILE:-lab}
    image: geodatalab:${GDL_TAG:-latest}
    # container_name comes from the generated fragment (geodatalab / geodatalab-<instance>)
    ports:
      - "${GDL_PORT:-8888}:8888"
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-}
      - GDL_MODE=${GDL_MODE:-lab}
      - GDL_ROOT=/gdl
      - GDL_WORKSPACE=/gdl/workspace
      - GDL_DATA=/gdl/data
    security_opt:
      - label=disable
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "[ \"${GDL_MODE:-lab}\" = idle ] || python3 -c \"import socket; socket.create_connection(('localhost', 8888), 2).close()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
